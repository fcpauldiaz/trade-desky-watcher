name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build-mac:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-app.txt
      - run: python3 scripts/generate_icons.py
      - run: python3 scripts/fetch_update_frameworks.py --sparkle
      - run: python3 setup.py py2app
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD}" ]; then
            echo "MACOS_CERTIFICATE_P12_BASE64 and MACOS_CERTIFICATE_PASSWORD are required"
            exit 1
          fi
          chmod +x scripts/ci_macos_keychain.sh
          ./scripts/ci_macos_keychain.sh
      - name: Sign and notarize
        timeout-minutes: 30
        env:
          REQUIRE_SIGNING: "1"
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "${APPLE_API_KEY}" ] || [ -z "${APPLE_API_KEY_ID}" ] || [ -z "${APPLE_API_ISSUER}" ]; then
            echo "APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER are required to notarize"
            exit 1
          fi
          if [ -z "${SIGN_IDENTITY}" ]; then
            echo "MACOS_SIGN_IDENTITY is required"
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "${APPLE_API_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          export APPLE_API_KEY_FILE="${KEY_FILE}"
          unset APPLE_API_KEY
          chmod +x scripts/sign_and_notarize_mac.sh
          ./scripts/sign_and_notarize_mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: trade-desky-watcher-macos
          path: dist/*.dmg

  build-win:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-windows.txt -r requirements-dev.txt
      - run: python scripts/generate_icons.py
      - run: python scripts/fetch_update_frameworks.py --winsparkle
      - run: python -m PyInstaller notification_watcher.spec
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $version = python -c "from notification_watcher.version import __version__; print(__version__)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\TradeDeskyWatcher\TradeDeskyWatcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Trade Desky Watcher
          description-url: https://tradedesky.chapilabs.com
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Install NSIS
        run: choco install nsis -y
      - run: python scripts/build_windows_installer.py
      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\TradeDeskyWatcher-${{ steps.ver.outputs.version }}-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Trade Desky Watcher Setup
          description-url: https://tradedesky.chapilabs.com
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Zip Windows build
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist/TradeDeskyWatcher -DestinationPath "dist/TradeDeskyWatcher-$version-win.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: trade-desky-watcher-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Resolve version
        id: version
        run: |
          VERSION=$(python -c "from notification_watcher.version import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*setup.exe' \) -exec cp {} release/ \;
          ls -la release/
      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG=$(ls release/*.dmg | head -1)
          SETUP=$(ls release/*-setup.exe | head -1)
          python scripts/generate_appcast.py \
            --version "$VERSION" \
            --dmg "$DMG" \
            --dmg-url "https://tradedesky.chapilabs.com/desktop/$(basename "$DMG")" \
            --win-setup "$SETUP" \
            --win-setup-url "https://tradedesky.chapilabs.com/desktop/$(basename "$SETUP")" \
            --sign \
            -o release/appcast.xml
      - name: Publish assets to Trade Desky
        env:
          # Origin hostname (not the Cloudflare domain) — GitHub Actions IPs get a managed challenge on trade-receiver.chapilabs.com.
          RECEIVER_API_URL: ${{ secrets.RECEIVER_API_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          RECEIVER="${RECEIVER_API_URL:-https://trade-receiver.chapilabs.com}"
          python scripts/publish_desktop_assets.py --receiver "$RECEIVER" --dir release
      - name: Create or move version tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          git tag -f "$TAG" "${{ github.sha }}"
          git push origin "$TAG" --force
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trade Desky Watcher ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS | `TradeDeskyWatcher-*.dmg` — drag the app to Applications |
            | Windows | `TradeDeskyWatcher-*-setup.exe` — per-user installer (used by auto-update) |
            | Windows (portable) | `TradeDeskyWatcher-*-win.zip` — extract and run `TradeDeskyWatcher.exe` |

            Public downloads: https://tradedesky.chapilabs.com/download

            Bundled builds update through Sparkle (macOS) and WinSparkle (Windows) using this site's `appcast.xml`.
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
      - name: Purge Cloudflare desktop cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/purge_cloudflare_desktop_cache.py
