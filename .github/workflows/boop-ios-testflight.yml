name: Boop iOS TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          repository: chrisgreg/boop
          path: boop

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "${APPLE_API_KEY}" > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"

      - name: Configure signing
        working-directory: boop/ios
        run: |
          sed -i '' 's/bundleIdPrefix: com.example/bundleIdPrefix: com.chapilabs/' project.yml
          sed -i '' 's/DEVELOPMENT_TEAM: ""/DEVELOPMENT_TEAM: "GGGP7AV2E7"/' project.yml
          sed -i '' 's/com.example.Boop/com.chapilabs.boop/g' project.yml
          brew install xcodegen
          xcodegen generate

      - name: Register App Store Connect app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          gem install fastlane --no-document
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          export KEY_PATH
          ruby <<'RUBY'
          require "spaceship/connect_api"
          require "spaceship/connect_api/spaceship"

          Spaceship::ConnectAPI.auth(
            key_id: ENV.fetch("APPLE_API_KEY_ID"),
            issuer_id: ENV.fetch("APPLE_API_ISSUER"),
            filepath: ENV.fetch("KEY_PATH")
          )

          bundle_id_record = Spaceship::ConnectAPI::BundleId.find("com.chapilabs.boop")
          unless bundle_id_record
            Spaceship::ConnectAPI::BundleId.create(
              name: "Boop",
              identifier: "com.chapilabs.boop",
              platform: Spaceship::ConnectAPI::BundleIdPlatform::IOS
            )
            puts "Created bundle id com.chapilabs.boop"
          else
            puts "Bundle id com.chapilabs.boop already exists"
          end

          app = Spaceship::ConnectAPI::App.find("com.chapilabs.boop")
          unless app
            if ENV["APPLE_ID"] && ENV["APPLE_APP_SPECIFIC_PASSWORD"]
              puts "Creating App Store Connect app with Apple ID..."
              system(
                {
                  "FASTLANE_USER" => ENV["APPLE_ID"],
                  "FASTLANE_PASSWORD" => ENV["APPLE_APP_SPECIFIC_PASSWORD"],
                  "FASTLANE_HIDE_GITHUB_ISSUES" => "1",
                  "FASTLANE_SKIP_UPDATE_CHECK" => "1"
                },
                "fastlane", "produce",
                "--app_identifier", "com.chapilabs.boop",
                "--app_name", "Boop",
                "--language", "en-US",
                "--app_version", "1.3.0",
                "--sku", "com.chapilabs.boop",
                "--team_id", "GGGP7AV2E7",
                "--skip_devcenter", "true"
              ) || raise("fastlane produce failed")
              app = Spaceship::ConnectAPI::App.find("com.chapilabs.boop")
            else
              begin
                Spaceship::ConnectAPI::App.create(
                  name: "Boop",
                  primary_locale: "en-US",
                  sku: "com.chapilabs.boop",
                  bundle_id: "com.chapilabs.boop",
                  version_string: "1.3.0",
                  platforms: [Spaceship::ConnectAPI::Platform::IOS]
                )
                app = Spaceship::ConnectAPI::App.find("com.chapilabs.boop")
                puts "Created App Store Connect app Boop"
              rescue Spaceship::AccessForbiddenError
                puts "API key cannot create apps. Add APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD secrets,"
                puts "or create Boop manually: https://appstoreconnect.apple.com/apps"
              end
            end
          else
            puts "App Store Connect app Boop already exists"
          end

          unless Spaceship::ConnectAPI::App.find("com.chapilabs.boop")
            puts "::error::App Store Connect app com.chapilabs.boop is missing."
            puts "::error::Create it at https://appstoreconnect.apple.com/apps (New App → iOS → Boop → com.chapilabs.boop), then rerun this workflow."
            exit 1
          end
          RUBY

      - name: Archive
        working-directory: boop/ios
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcodebuild -project Boop.xcodeproj -scheme Boop -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Boop.xcarchive" archive \
            DEVELOPMENT_TEAM=GGGP7AV2E7 \
            -authenticationKeyPath "${KEY_PATH}" \
            -authenticationKeyID "${APPLE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APPLE_API_ISSUER}" \
            -allowProvisioningUpdates

      - name: Export IPA
        working-directory: boop/ios
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>GGGP7AV2E7</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Boop.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "${KEY_PATH}" \
            -authenticationKeyID "${APPLE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APPLE_API_ISSUER}" \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          test -n "${IPA}"
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA}" \
            --apiKey "${APPLE_API_KEY_ID}" \
            --apiIssuer "${APPLE_API_ISSUER}"
