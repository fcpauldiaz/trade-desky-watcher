name: Boop iOS TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          repository: chrisgreg/boop
          path: boop

      - name: Configure signing
        working-directory: boop/ios
        run: |
          sed -i '' 's/bundleIdPrefix: com.example/bundleIdPrefix: com.chapilabs/' project.yml
          sed -i '' 's/DEVELOPMENT_TEAM: ""/DEVELOPMENT_TEAM: "GGGP7AV2E7"/' project.yml
          sed -i '' 's/com.example.Boop/com.chapilabs.boop/g' project.yml
          brew install xcodegen
          xcodegen generate

      - name: Archive
        working-directory: boop/ios
        run: |
          xcodebuild -project Boop.xcodeproj -scheme Boop -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Boop.xcarchive" archive \
            DEVELOPMENT_TEAM=GGGP7AV2E7 \
            -allowProvisioningUpdates

      - name: Export IPA
        working-directory: boop/ios
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>GGGP7AV2E7</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Boop.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Create App Store Connect app record
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY_FILE="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "${APPLE_API_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          gem install fastlane --no-document
          fastlane run produce \
            app_identifier:com.chapilabs.boop \
            app_name:Boop \
            language:en-US \
            app_version:1.3.0 \
            skip_itc:true \
            skip_devcenter:false \
            api_key_path:"${KEY_FILE}" \
            api_key_id:"${APPLE_API_KEY_ID}" \
            api_issuer:"${APPLE_API_ISSUER}" || true

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY_FILE="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "${APPLE_API_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          test -n "${IPA}"
          xcrun altool --upload-app -f "${IPA}" -t ios \
            --apiKey "${APPLE_API_KEY_ID}" \
            --apiIssuer "${APPLE_API_ISSUER}" \
            --apiKeyPath "${KEY_FILE}"
